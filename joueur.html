<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loup-Garou — Joueur</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🐺 Loup-Garou</h1>

  <div id="ecran-connexion" class="carte">
    <div class="section-titre">Code de la partie</div>
    <input id="input-code" placeholder="Ex: XK4P9Q" style="text-transform:uppercase;">
    <div class="section-titre">Ton prénom</div>
    <input id="input-prenom" placeholder="Ton prénom">
    <div class="section-titre">Carte physique reçue du MJ</div>
    <select id="input-carte">
      <option value="villageois">Simple Villageois</option>
      <option value="loup-garou">Loup-Garou</option>
      <option value="voyante">Voyante</option>
      <option value="sorciere">Sorcière</option>
      <option value="cupidon">Cupidon</option>
      <option value="chasseur">Chasseur</option>
      <option value="medium">Médium</option>
    </select>
    <button onclick="rejoindre()">Rejoindre la partie</button>
  </div>

  <div id="ecran-jeu" style="display:none;">
    <div class="carte">
      <div id="phase-actuelle">Phase : lobby</div>
      <div id="pouvoir-bonus" class="log"></div>
      <div id="gazette" style="display:none;"></div>
      <div id="alerte-signal-perdu" style="display:none; color:#8c2f39;">📡 SIGNAL PERDU — tu ne peux ni voter ni discuter ce tour-ci.</div>
    </div>

    <div id="bloc-nuit" class="carte" style="display:none;">
      <div class="section-titre">Actions de nuit</div>
      <div id="action-role"></div>
      <div id="pouvoir-numerique-action"></div>
    </div>

    <div id="bloc-vote" class="carte" style="display:none;">
      <div class="section-titre">Vote synchronisé</div>
      <div id="timer-vote" class="timer">--:--</div>
      <div id="suspects"></div>
      <button onclick="envoyerVote()">Sceller mon vote</button>
    </div>

    <div id="bloc-alerte" class="carte" style="display:none;">
      <div class="section-titre">📢 Place du Village</div>
      <div id="fil-village" class="chat-fil"></div>
    </div>

    <div id="bloc-quartier" class="carte" style="display:none;">
      <div class="section-titre">🏘️ Mon Quartier</div>
      <div id="chat-quartier" class="chat-fil"></div>
      <input id="msg-quartier" placeholder="Écrire au Quartier...">
      <button onclick="envoyerMessage('quartier')">Envoyer</button>
    </div>

    <div id="bloc-meute" class="carte" style="display:none;">
      <div class="section-titre">🐺 Meute</div>
      <div id="chat-meute" class="chat-fil"></div>
      <input id="msg-meute" placeholder="Écrire à la Meute...">
      <button onclick="envoyerMessage('meute')">Envoyer</button>
    </div>

    <div id="bloc-cocon" class="carte" style="display:none;">
      <div class="section-titre">💌 Cocon des Amoureux</div>
      <div id="chat-cocon" class="chat-fil"></div>
      <input id="msg-cocon" placeholder="Écrire au Cocon...">
      <button onclick="envoyerMessage('cocon')">Envoyer</button>
    </div>

    <div id="bloc-cimetiere" class="carte" style="display:none;">
      <div class="section-titre">⚰️ Cimetière</div>
      <div id="chat-cimetiere" class="chat-fil"></div>
      <input id="msg-cimetiere" placeholder="Écrire au Cimetière...">
      <button onclick="envoyerMessage('cimetiere')">Envoyer</button>
    </div>

    <div class="carte">
      <div class="section-titre">Joueurs</div>
      <div id="liste-joueurs"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="joueur.js"></script>
</body>
</html>
